<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color:chartreuse;
            height: 300px;
            width:300px;
            position: static;
        }
        .box2{
            background-color: rgb(0, 47, 255);
            height: 300px;
            width: 300px;
            position: fixed;
            left: 1650px;
            bottom: 0px;
        }
        .box3{
            background-color: rgb(255, 0, 43);
            height: 300px;
            width: 300px;
            position: fixed;
            left: 1650px;
            top: 0px;
        }
        .box4{
            background-color: rgb(255, 166, 0);
            height: 300px;
            width: 300px;
            position:absolute;
            right: 1650px;
            top: 650px;
        }



    </style>

</head>
<body>
    <div class="box1">box
        <div class="box2">box
            <div class="box3">box
                <div class="box4">box
                </div>
            </div>
        </div>

    </div>
</body>
</html>
